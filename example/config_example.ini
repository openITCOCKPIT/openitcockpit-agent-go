[default]
#
# This is the configuration file for the openITCOCKPIT Monitoring Agent 3.x
# Notice: Empty values will not been ignored! If you want to disable an option like proxy comment it out!

#########################
#       Web Server      #
#########################

# Bind address of the build-in web server
# Use 0.0.0.0 to bind on all interfaces
address = 0.0.0.0

# Port of the Agents build-in web server
# Default port is 3333
port = 3333

#########################
#   Security Settings   #
#########################

# Try to enable auto ssl mode for webserver
try-autossl = True

# Determins the enforced security level of the used TLS connection
# supported values:
# - lax
# - intermediate
# - modern
#
# lax
# Enforce minimum TLS 1.2 but does not restrict usage of cipher suites
# Was the default behavior before openITCOCKPIT Agent Version 3.1
#
# intermediate
# Enforce minimum TLS 1.2 and restrict usage of cipher suites to:
# TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
# TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305, TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
#
# modern
# Enforce minimum TLS 1.3 not restrict usage of cipher suites
tls-security-level = intermediate

# File paths used to store autossl related files (default: /etc/openitcockpit-agent/):
# Leave this blank to use the default values
# Example: /etc/openitcockpit-agent/agent.csr
#autossl-csr-file =

# Example: /etc/openitcockpit-agent/agent.crt
#autossl-crt-file =

# Example: /etc/openitcockpit-agent/agent.key
#autossl-key-file =

# Example: /etc/openitcockpit-agent/server_ca.crt
#autossl-ca-file =

# If a certificate file is given, the agent will only be accessible through HTTPS
# Instead of messing around with self-signed certificates we recommend to use the autossl feature.
# Example: /etc/ssl/certs/ssl-cert-snakeoil.pem
#certfile = /etc/ssl/certs/ssl-cert-snakeoil.pem

# Private key file of the given TLS certificate
# Example: /etc/ssl/private/ssl-cert-snakeoil.key
#keyfile = /etc/ssl/private/ssl-cert-snakeoil.key

# Enable remote read and write access to the current agent configuration (this file),
# the customchecks, logfiles, certificates, files, http, perfcounters and redfish config
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# ! WARNING: This could lead to remote code execution    !
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
config-update-mode = False

# Enable HTTP Basic Authentication
# Disabled if blank
# Example: auth = user:password
#auth = user:password

#########################
#        Checks         #
#########################

# Determines in seconds how often the agent will schedule all internal checks
interval = 30

# Remote Plugin Execution
# Path to config will where custom checks can be defined
# Leave blank for the default value
#
# Linux: /etc/openitcockpit-agent/customchecks.ini
# Windows: C:\Program Files\openitcockpit-agent\customchecks.ini
# macOS: /Applications/openitcockpit-agent/customchecks.ini
#customchecks = /etc/openitcockpit-agent/customchecks.ini

# Logfile monitoring
# Path to the config where log files, journald (Linux) and unified log (macOS) sources can be defined
# The check is disabled if the file does not exist or contains no enabled definition
# Leave blank for the default value
#
# Linux: /etc/openitcockpit-agent/logfiles.ini
# Windows: C:\Program Files\openitcockpit-agent\logfiles.ini
# macOS: /Applications/openitcockpit-agent/logfiles.ini
#logfiles = /etc/openitcockpit-agent/logfiles.ini

# Certificate monitoring
# Path to the config where certificate files and Windows certificate stores can be defined
# The check is disabled if the file does not exist or contains no enabled definition
#
# Linux: /etc/openitcockpit-agent/certificates.ini
# Windows: C:\Program Files\openitcockpit-agent\certificates.ini
# macOS: /Applications/openitcockpit-agent/certificates.ini
#certificates = /etc/openitcockpit-agent/certificates.ini

# File and directory monitoring
# Path to the config where files and directories can be defined
# The check is disabled if the file does not exist or contains no enabled definition
#
# Linux: /etc/openitcockpit-agent/files.ini
# Windows: C:\Program Files\openitcockpit-agent\files.ini
# macOS: /Applications/openitcockpit-agent/files.ini
#files = /etc/openitcockpit-agent/files.ini

# HTTP(S) endpoint monitoring
# Path to the config where HTTP(S) endpoints can be defined
# The check is disabled if the file does not exist or contains no enabled definition
#
# Linux: /etc/openitcockpit-agent/http.ini
# Windows: C:\Program Files\openitcockpit-agent\http.ini
# macOS: /Applications/openitcockpit-agent/http.ini
#http = /etc/openitcockpit-agent/http.ini

# Windows performance counters (Windows only)
# Path to the config where performance counters can be defined
# The check is disabled if the file does not exist or contains no enabled definition
#
# Windows: C:\Program Files\openitcockpit-agent\perfcounters.ini
#perfcounters = C:\Program Files\openitcockpit-agent\perfcounters.ini

# Redfish hardware monitoring of servers (Dell iDRAC, HPE iLO, Lenovo XClarity, Supermicro, ...)
# Path to the config where the BMCs can be defined. The file contains passwords!
# The check is disabled if the file does not exist or contains no enabled definition
#
# Linux: /etc/openitcockpit-agent/redfish.ini
# Windows: C:\Program Files\openitcockpit-agent\redfish.ini
# macOS: /Applications/openitcockpit-agent/redfish.ini
#redfish = /etc/openitcockpit-agent/redfish.ini

#########################
# Enable/Disable checks #
#########################

# Enable CPU monitoring
cpustats = True

# Enable memory monitoring
memory = True

# Enable Swap monitoring
swap = True

# Enable monitoring of running processes
processstats = True

# Enable monitoring of network interfaces
netstats = True

# Enable monitoring of the traffic (I/O) of network interfaces
netio = True

# Enable disk usage monitoring
diskstats = True

# Enable monitoring of disk I/O
diskio = True

# Enable monitoring of Systemd Services (Linux only)
systemdservices = True

# Enable monitoring of Launchd Services (macOS only)
launchdservices = True

# Enable monitoring of Windows Services (Windows only)
winservices = True

# Enable monitoring of Windows scheduled tasks (Windows only)
# By default the tasks of the \Microsoft\ folder (hundreds of tasks of Windows itself) are not reported
winscheduledtasks = True
winscheduledtasks-include-microsoft = False

# Enable monitoring of Windows Event Log records (Windows only)
wineventlog = False

# Determines how the openITCOCKPIT Monitoring Agent should query the Windows Event Log.
# Since Version 3.0.9 WMI (Windows Management Instrumentation) will be used by default
# As alternative the Agent could use the PowerShell Get-EventLog cmdlet.
# The WMI method will maybe memory leak on Windows Server 2016. The PowerShell workaround
# on the other hand could lead to blue screens (OA-40).
#
# EvtApi uses the Windows Event Log API (wevtapi.dll) directly, like the Event Viewer does. It does not
# depend on WMI or PowerShell. Only the records of the time window (wineventlog-age) get queried on the first
# run, every following run only queries new records. Modern event logs like
# Microsoft-Windows-PowerShell/Operational are supported as well.
wineventlog-method = WMI
#wineventlog-method = PowerShell
#wineventlog-method = EvtApi

# EvtApi only: Maximum number of records per event log. If more records are in the time window,
# only the newest records are reported
wineventlog-max-records = 1000

# Define comma separated windows event log log types
# Event Logs containing spaces DO NOT need to be quoted: Security,Sophos Cloud AD Sync,Application
wineventlog-logtypes = System,Application,Security

# Define the age in seconds of the event log records
wineventlog-age = 3600

# Enable monitoring of temperature and battery sensors
sensorstats = True

# Enable support to monitor Docker containers
# Known issues: Error response from daemon: client version 1.41 is too new. Maximum supported API version is 1.40
# Workaround: export DOCKER_API_VERSION=1.40
dockerstats = False

# Check KVMs through libvirt
# This requires to compile the openITCOCKPIT Monitoring Agent by yourself.
# Please see the Wiki for instructions: https://github.com/openITCOCKPIT/openitcockpit-agent-go/wiki/Build-binary
libvirt = False

# Enable logged in users check
userstats = True

# Enable system time monitoring
# Windows: Requires at least Windows Server 2016 or newer: https://learn.microsoft.com/en-us/windows-server/networking/windows-time-service/windows-server-2016-improvements
# macOS: The agent measures the offset to the time server of the system settings (/etc/ntp.conf, default time.apple.com)
#        with an SNTP query every 5 minutes. If the time server is not reachable (UDP port 123), the system clock
#        gets compared to the openITCOCKPIT servers clock
# FreeBSD: If ntpd is running and synchronized, the offset of ntpd is used. Otherwise the agent measures the offset
#          to the time server of /etc/ntp.conf, /usr/local/etc/chrony.conf or /usr/local/etc/ntpd.conf (OpenNTPD)
#          with an SNTP query, like on macOS
# Linux: For Docker environments you may have to set the --cap-add=SYS_TIME flag.
ntp = True

# Enable monitoring of operating system security features
# Linux: SELinux and AppArmor
# Windows: Firewall profiles, Microsoft Defender and antivirus products of the Windows Security Center
# macOS: FileVault, System Integrity Protection and the application firewall
security = True

# Enable monitoring of ZFS pools and the ZFS ARC (Linux and FreeBSD)
# The check is only enabled if the zpool command is installed
zfs = True

# Enable SMART monitoring of all disks (Linux, Windows, macOS)
# Requires smartmontools 7.0 or newer (smartctl). The check is only enabled if smartctl is installed.
# Sleeping disks are not woken up. The disks are queried every 5 minutes.
smart = True

# Enable monitoring of Proxmox VE (Linux only): cluster quorum, HA, storages, guests, backups and replication
# The check is only enabled on Proxmox VE nodes (pvesh and /etc/pve). The data is collected every 2 minutes.
proxmox = True

# Enable monitoring of the Ceph cluster (Linux only), e.g. on Proxmox VE nodes
# The check is only enabled if the ceph command and /etc/ceph/ceph.conf exist
# The agent requires access to the admin keyring, which is given if the agent runs as root
ceph = True

# Enable monitoring of the Postfix mail queues (Linux and FreeBSD)
# Requires Postfix 3.1 or newer (postqueue -j). The check is only enabled if Postfix is installed.
postfix = True

# Enable monitoring of the Exim mail queue (Linux and FreeBSD)
# The check is only enabled if Exim is installed (exim4 or exim)
exim = True

# Enable monitoring of LVM thin pools (Linux only): usage of data and metadata
# The check is only enabled if LVM is installed (lvs)
lvm = True

# Enable monitoring of the filesystems of the /etc/fstab which are not mounted (Linux and FreeBSD)
mounts = True

# Enable monitoring of the network ports: listening ports with their processes, TCP connections per state
# and the usage of the ephemeral ports. On Linux also TCP and UDP errors (e.g. accept queue overflows).
# The processes of the listening ports of other users require root (Linux, FreeBSD) or SYSTEM (Windows).
networkports = True

# Enable monitoring of the local BMC with IPMI (Linux and Windows): sensors (temperatures, fans, voltages,
# power supplies, ...), chassis status and the system event log (SEL)
# Linux: the check is only enabled if /dev/ipmi0 exists (kernel modules ipmi_si and ipmi_devintf), requires root.
# Windows: the check is only enabled if the Microsoft IPMI driver (IPMIDRV) is running, requires the agent to run as service.
# No tools like ipmitool are required. The BMC is queried in the background every ipmi-interval seconds.
ipmi = True
ipmi-interval = 60
# SEL entries with warnings or errors are reported for this time in seconds (default 24 hours)
ipmi-sel-window = 86400

# Enable Linux system health monitoring (Linux only)
# Software RAID (/proc/mdstat), OOM kills, file descriptors, conntrack table usage, pressure stall information (PSI),
# bonding (/proc/net/bonding), filesystem errors (ext4 and btrfs) and memory errors (EDAC)
systemhealth = True

#########################
#       Push mode       #
#########################

# By default openITCOCKPIT will pull check results from the openITCOCKPIT Agent.
# In a cloud environments or behind a NAT network it could become handy
# if the openITCOCKPIT Monitoring Agent will push the results to your openITCOCKPIT Server
[oitc]

# Enable Push Mode
enabled = False

# This option disables the webserver of the openITCOCKPIT Monitoring Agent when running in PUSH mode.
# When you also want to enable the Webserver even if the agent is running in PUSH mode we highly recommend
# to enable HTTP Basic Authentication and to use the certfile and keyfile options to enable HTTPS
enable-webserver = False

# Address of your openITCOCKPIT Server where the Agent will push the results to
# Example: https://demo.openitcockpit.io
url =

# Enable this option to verify the TLS certificate of your openITCOCKPIT server, e.g. if it uses a certificate
# of Let's Encrypt or of a CA which is installed on this system. If the certificate is not valid, no data is pushed.
verify-server-certificate = False

# Certificate of your own CA (PEM, can contain several certificates, e.g. root and intermediate CA) or the self
# signed certificate of your openITCOCKPIT server. It is trusted in addition to the CAs of the system, so the CA does
# not need to be installed on this system. Only used if verify-server-certificate is enabled.
# The certificate must contain the name or IP address of the url as subject alternative name.
# Example: /etc/openitcockpit-agent/openitcockpit-ca.crt
#server-ca-file =

# Timeout in seconds for the HTTP push client
timeout = 1

# API-Key of your openITCOCKPIT Server
apikey =

# Address of HTTP/HTTPS Proxy if required.
# Leave blank to not use a proxy server
# Example: http://10.10.1.10:3128
#proxy = http://10.10.1.10:3128


#########################
#  Prometheus Exporter  #
#########################

# The openITCOCKPIT Monitoring Agent can act as a Prometheus Exporter proxy.
# This means that the Agent will scrape the metrics from the exporters defined in the prometheus_exporters.ini
# and will expose them on the /prometheus endpoint.
# The openITCOCKPIT Agent will not touch the metrics itself.
# If the Agent is configured to use TLS encryption the /prometheus endpoint will also be encrypted.

[prometheus]

# Determines if the openITCOCKPIT Agent should act as a Prometheus Exporter
enabled = True

# List of Prometheus Exporters
#
# Leave blank for the default value
#
# Linux: /etc/openitcockpit-agent/prometheus_exporters.ini
# Windows: C:\Program Files\openitcockpit-agent\prometheus_exporters.ini
# macOS: /Applications/openitcockpit-agent/prometheus_exporters.ini
#exporters = /etc/openitcockpit-agent/prometheus_exporters.ini

#########################
#   Software Inventory  #
#########################

[packagemanager]
# The openITCOCKPIT Monitoring Agent can collect a software inventory of installed packages
# and also check for available package updates.
# Supported package managers:
# - Debian based systems: apt-get, dpkg
# - RedHat based systems: dnf, yum
# - SUSE based systems: zypper
# - Arch based systems: pacman
# - RPM based systems: rpm (last resort)
# - Windows: Windows Installed Software and Windows Updates
# - macOS: Installed Software and macOS Software Updates

# Enable Software Inventory Collection
enabled = True

# Interval in minutes how often the software inventory should be collected
check-interval = 60

# Enable check for available package updates
# This option will refresh the meta data of the package manager (e.g. apt-get update) and
# will check if updates are available for installed packages.
# It will NOT INSTALL ANY UPDATES!
# This option requires that the packagemanager is in a working state.
# This means that the command apt-get update or dnf --refresh should work without errors
# Note: If your system requires a proxy server to access the internet please make sure that
# the proxy settings are correctly configured for the used package manager.
enable-update-check = True

# By enabling this option the openITCOCKPIT Monitoring Agent will also check
# and query alternative or third party package managers.
# Currently supported alternative package managers are:
# - macOS: brew
enable-alternative-packagemanagers = False


# Limit the length of package description strings
# -1 = no limit (complete description, not recommended)
#  0 = disable descriptions
# >0 = limit length to given number of characters
limit-description-length = 80
